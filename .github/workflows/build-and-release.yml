name: Build and Release

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.13"]
        target: [x86_64, x86, aarch64, armv7, s390x, ppc64le]
    name: Ubuntu, ${{ matrix.target }}, Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
          manylinux: auto
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-ubuntu-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  windows:
    runs-on: windows-latest
    strategy:
      matrix:
        python-version: ["3.13"]
        target: [x64, x86]
    name: Windows, ${{ matrix.target }}, Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          architecture: ${{ matrix.target }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-windows-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  macos:
    runs-on: macos-latest
    strategy:
      matrix:
        python-version: ["3.13"]
        target: [x86_64, aarch64]
    name: macOS, ${{ matrix.target }}, Python ${{ matrix.python-version }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - name: Build wheels
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --out dist --find-interpreter
          sccache: "true"
      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: wheels-macos-${{ matrix.target }}-${{ matrix.python-version }}
          path: dist

  test-python:
    runs-on: ubuntu-latest
    needs: linux
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.15", "3.15t"]
    steps:
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          allow-prereleases: true
      # Bin bindings produce py3-none wheels; test the existing native wheel.
      - uses: actions/download-artifact@v8
        with:
          name: wheels-ubuntu-x86_64-3.13
          path: dist
      - name: Install wheel and test CLI
        env:
          EXPECTED_PYTHON: ${{ matrix.python-version }}
        run: |
          python -m pip install --no-index --find-links dist --force-reinstall lgtmeow
          python - <<'PY'
          import os, sys, sysconfig
          from importlib.metadata import metadata
          expected = os.environ["EXPECTED_PYTHON"]
          assert sys.version_info[:2] == tuple(map(int, expected.rstrip("t").split(".")))
          assert bool(sysconfig.get_config_var("Py_GIL_DISABLED")) == expected.endswith("t")
          if expected.endswith("t"):
              assert not sys._is_gil_enabled()
          assert metadata("lgtmeow")["Requires-Python"] == ">=3.11"
          print(sys.version)
          PY
          cli="$(python -c 'import sysconfig; print(sysconfig.get_path("scripts") + "/lgtmeow")')"
          export HOME="$(mktemp -d)"
          "$cli" --version
          "$cli" --help
          "$cli" setup --default
          "$cli" -r | grep 'LGTMeow <img '

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build sdist
        uses: PyO3/maturin-action@v1
        with:
          command: sdist
          args: --out dist
      - name: Upload sdist
        uses: actions/upload-artifact@v7
        with:
          name: wheels-sdist
          path: dist

  publish-pypi:
    runs-on: ubuntu-latest
    name: Publish to PyPI
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [linux, windows, macos, sdist]
    permissions:
      id-token: write

    steps:
      - name: Retrieve release distributions
        uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Publish release distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1

  publish-github-releases:
    runs-on: ubuntu-latest
    name: Publish to GitHub Releases
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    needs: [linux, windows, macos, sdist]
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: wheels-*
          merge-multiple: true
          path: dist
      - name: Get tag name
        run: echo "RELEASE_VERSION=${GITHUB_REF#refs/*/}" >> $GITHUB_ENV
      - name: Publish to GitHub
        uses: softprops/action-gh-release@v3
        with:
          draft: true
          files: dist/*
          tag_name: ${{ env.RELEASE_VERSION }}

  publish-crates-io:
    runs-on: ubuntu-latest
    name: Publish to Crates.io
    if: ${{ startsWith(github.ref, 'refs/tags/') }}
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
      - name: Publish to Crates.io
        uses: katyo/publish-crates@v2
        id: publish-crates
        with:
          registry-token: ${{ secrets.CARGO_REGISTRY_TOKEN }}
